# .github/workflows/deploy.yml
name: Deploy web to Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ftp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_POCKETBASE_URL: ${{ vars.EXPO_PUBLIC_POCKETBASE_URL }}

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ vars.FTP_HOST }}
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ vars.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/workout/
          # Expo emits font assets under assets/node_modules/@expo-google-fonts/...
          # so we must NOT use the action's default node_modules exclude.
          exclude: |
            **/.git*
            **/.git*/**
